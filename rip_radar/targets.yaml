# Built-in sources. Ships with the app; changes here arrive through app updates.
# Pages you add yourself in the app (Sources > Watch a page) are stored in your settings instead.
#
# types:
#   topps_calendar = reads every card on topps.com/release-calendar (sports filter in Settings)
#   listing        = alerts when a NEW product link appears on a page
#   keywords       = alerts when a page flips live (queue page, "Enter drawing", "Request invite"...)
#   feed           = RSS (news / Reddit): new posts about raffles, drawings, invites, queues, drop times
# browser: true    = load with the app's built-in browser (sites with bot walls)
default_interval_seconds: 90

targets:
  # ===== TOPPS =====
  - name: Topps release calendar
    channel: [topps_calendar, topps]
    type: topps_calendar
    url: https://www.topps.com/release-calendar
    interval_seconds: 90
    remind_minutes_before: 15

  # Every product topps.com loads (its product sitemaps list them the moment they're added): sealed formats of
  # every line - sports, Disney, F1, Star Wars... - Hobby, Jumbo, Mega, Blaster, Value, hangers, cases.
  # One self-editing card per format in #topps; @everyone when a new one loads and when it goes live.
  - name: Topps · every new product
    channel: topps
    type: topps_sitemap
    url: https://www.topps.com/products/sitemap.xml
    interval_seconds: 90
    sitemaps: 2
    max_pages_per_run: 4
    hot_seconds: 60
    idle_minutes: 30

  # Opens each calendar product's Topps page to read the exact announced time ("Available Sep 30 at 12pm ET",
  # "Drawing opens ... at 11am ET") so the calendars show times, not just days.
  - name: Topps product pages
    channel: topps
    type: topps_products
    times_only: true
    url: https://www.topps.com/release-calendar
    interval_seconds: 60
    idle_minutes: 15
    max_pages_per_run: 4

  - name: Topps.com homepage
    channel: topps
    type: listing
    url: https://www.topps.com/
    interval_seconds: 300
    level: normal
    link_pattern: "/(products|pages)/"
    include: [basketball, baseball, football, bowman]

  # Topps' raffle / entry site (EQL): Topps runs its most wanted boxes here (SpongeBob Chrome, Chrome F1, Tribute,
  # Pristine, Definitive...) - you ENTER during a window instead of racing checkout. EQL has no public list of every
  # store's raffles (each brand has its own launch site; the other card ones are Australian Pokémon shops), so this is
  # the one to watch for US cards. Every launch page is opened for price / limit / entry window. New raffle, opens,
  # and 1 h before close = @everyone (#watch) + #topps + #drawings with the exact EQL link. Topps product pages that
  # link a launch are caught too. Alert only: M enters himself.
  - name: Topps raffles (EQL)
    channel: topps
    type: eql_launches
    url: https://launches.topps.com/en-US/
    browser: true
    interval_seconds: 300

  # ===== POKEMON RELEASE DATES -> drop calendar (🎴) =====
  # pokemon.com's monthly "Check Out Every Pokémon TCG Product Release in <Month> <Year>" (this month + next)
  - name: Pokémon releases (pokemon.com monthly)
    type: pokemon_releases
    url: https://www.pokemon.com/us/news/
    browser: true
    months: 2
    interval_seconds: 21600
  # The Pokémon Company's press site: the official product schedule
  - name: Pokémon product schedule (press site)
    type: release_schedule
    url: https://press.pokemon.com/en/Items/Schedule/Pokemon-Trading-Card-Game?types=3
    browser: true
    interval_seconds: 21600
  # pokemonrestock.com's drop calendar (Target / Walmart / Walmart Draw / Pokémon Center) - drawn in the browser
  - name: Drop tracker calendar (pokemonrestock.com)
    type: release_schedule
    grid: true
    url: https://pokemonrestock.com/
    browser: true
    interval_seconds: 3600

  # ===== POKEMON CENTER =====
  # Checked every minute. @everyone the moment the queue (waiting room) is up, a message that keeps
  # counting how long it's been up, and the total time when it closes. Own channel if set, else Pokémon Center.
  - name: Pokémon Center queue
    type: keywords
    url: https://www.pokemoncenter.com/
    browser: true
    channel: [pokemon_queue, pokemon]
    track_duration: true
    interval_seconds: 60
    category: Pokémon
    alert_title: "🚨 POKÉMON CENTER QUEUE IS LIVE"
    url_contains: [queue-it, queue, waitingroom, waiting-room]
    # Pokémon Center's own queue wording ("in line to enter", "redirected ... when it is your turn to enter") + common
    # waiting-room text. The page address changing to a queue page counts too.
    keywords: ["you are now in line", "in line to enter", "your turn to enter", "virtual queue", "waiting room",
               "estimated wait", "your place in line", "you are in the queue", "you're in line", "users ahead of you",
               "keep this window open", "do not refresh"]
    alert_on_end: true

  # Crunchyroll Store queue (waiting room for big drops) -> #hottopic: @everyone when it's up, a line that keeps
  # counting how long, and the total when it closes. Runs in the queue browser alongside the Pokémon Center one.
  - name: Crunchyroll queue
    type: keywords
    site: Crunchyroll Store
    url: https://store.crunchyroll.com/
    browser: true
    channel: hottopic
    track_duration: true
    interval_seconds: 60
    category: Pokémon
    alert_title: "🚨 CRUNCHYROLL STORE QUEUE IS LIVE"
    url_contains: [queue-it, queue., waitingroom, waiting-room]
    keywords: ["you are now in line", "in line to enter", "your turn to enter", "virtual queue", "waiting room",
               "estimated wait", "your place in line", "you are in the queue", "you're in line", "users ahead of you",
               "keep this window open", "do not refresh", "number in line", "queue is paused"]
    alert_on_end: true

  # Pokémon Center: SEALED categories only (its general TCG page is sleeves / binders / playmats). Kept light on
  # purpose - fewer Pokémon Center page loads = the queue check gets turned away less (these never speed up).
  - name: Pokémon Center · new TCG releases
    type: retail_search
    store: pokemon
    products: pokemon
    url: https://www.pokemoncenter.com/category/new-releases?category=trading-card-game
    browser: true
    channel: pokemon
    alert_new_listed: true
    verify_pages: 1
    interval_seconds: 420

  - name: Pokémon Center · Elite Trainer Boxes
    type: retail_search
    store: pokemon
    products: pokemon
    url: https://www.pokemoncenter.com/category/elite-trainer-box?sort=launch_date%2Bdesc
    browser: true
    channel: pokemon
    alert_new_listed: true
    verify_pages: 1
    interval_seconds: 900

  - name: Pokémon Center · boxed sets
    type: retail_search
    store: pokemon
    products: pokemon
    url: https://www.pokemoncenter.com/category/boxed-sets?sort=launch_date%2Bdesc
    browser: true
    channel: pokemon
    alert_new_listed: true
    verify_pages: 1
    interval_seconds: 900

  # ===== STORES: every Pokémon / sports-card product on their search pages.
  # Pings only when a card product is in stock (new, or back in stock), with picture, price and cart links.
  # Listings priced well above typical retail (resellers) are ignored; moderately above gets a ⚠️.
  # Amazon searches are limited to items sold by Amazon itself.
  - name: Target · Pokémon cards
    type: retail_search
    store: target
    products: pokemon
    url: https://www.target.com/s?searchTerm=pokemon+trading+cards&sortBy=newest
    browser: true
    channel: target
    interval_seconds: 240

  - name: Target · sports cards
    type: retail_search
    store: target
    products: sports
    url: https://www.target.com/s?searchTerm=sports+trading+cards&sortBy=newest
    browser: true
    channel: target
    interval_seconds: 300

  # Walmart's limited-time drawings (lotteries). Pings when a card item is listed, 15 min before entries
  # open, when they open, and 30 min before they close. Posts in #walmart AND #drawings.
  - name: Walmart · drawings
    type: walmart_drawings
    url: https://www.walmart.com/shop/collectibles/draw
    browser: true
    channel: walmart
    interval_seconds: 120

  - name: Walmart · Pokémon cards
    type: retail_search
    store: walmart
    products: pokemon
    url: https://www.walmart.com/search?q=pokemon+trading+cards&sort=new&facet=retailer_type%3AWalmart
    browser: true
    channel: walmart
    interval_seconds: 240

  - name: Walmart · sports cards
    type: retail_search
    store: walmart
    products: sports
    url: https://www.walmart.com/search?q=sports+trading+cards&sort=new&facet=retailer_type%3AWalmart
    browser: true
    channel: walmart
    interval_seconds: 300

  - name: Dick's · Pokémon cards
    type: retail_search
    store: dicks
    cards_only: true
    products: pokemon
    url: https://www.dickssportinggoods.com/search/SearchDisplay?searchTerm=pokemon+cards
    browser: true
    channel: dicks
    verify_pages: 1
    interval_seconds: 300

  - name: Dick's · sports cards
    type: retail_search
    store: dicks
    cards_only: true
    products: sports
    url: https://www.dickssportinggoods.com/search/SearchDisplay?searchTerm=trading+cards
    browser: true
    channel: dicks
    verify_pages: 1
    interval_seconds: 300

  - name: Best Buy · Pokémon cards
    type: retail_search
    store: bestbuy
    products: pokemon
    url: https://www.bestbuy.com/site/searchpage.jsp?st=pokemon+trading+cards&intl=nosplash
    browser: true
    channel: bestbuy
    interval_seconds: 300

  - name: Best Buy · sports cards
    type: retail_search
    store: bestbuy
    products: sports
    url: https://www.bestbuy.com/site/searchpage.jsp?st=sports+trading+cards&intl=nosplash
    browser: true
    channel: bestbuy
    interval_seconds: 300

  - name: Amazon · Pokémon cards
    type: retail_search
    store: amazon
    cards_only: true
    products: pokemon
    url: https://www.amazon.com/s?k=pokemon+trading+cards&rh=p_6%3AATVPDKIKX0DER&s=date-desc-rank
    browser: true
    channel: amazon
    live_if_price: true
    interval_seconds: 300

  - name: Amazon · sports cards
    type: retail_search
    store: amazon
    cards_only: true
    products: sports
    url: https://www.amazon.com/s?k=topps+trading+cards&rh=p_6%3AATVPDKIKX0DER&s=date-desc-rank
    browser: true
    channel: amazon
    live_if_price: true
    interval_seconds: 300

  # ===== MORE STORES (each has its own channel; CVS + Walgreens share one). Same rules as above: pings when a
  # Pokémon / sports-card product loads or comes in stock, @everyone for ETBs and UPCs.
  - name: Costco · Pokémon cards
    type: retail_search
    store: costco
    cards_only: true
    products: pokemon
    url: https://www.costco.com/CatalogSearch?dept=All&keyword=pokemon%20cards
    browser: true
    channel: costco
    verify_pages: 1
    interval_seconds: 360

  - name: Costco · sports cards
    type: retail_search
    store: costco
    cards_only: true
    products: sports
    url: https://www.costco.com/CatalogSearch?dept=All&keyword=trading%20cards
    browser: true
    channel: costco
    verify_pages: 1
    interval_seconds: 420

  - name: Sam's Club · Pokémon cards
    type: retail_search
    store: samsclub
    products: pokemon
    url: https://www.samsclub.com/s/pokemon%20trading%20cards
    browser: true
    channel: samsclub
    interval_seconds: 360

  - name: Sam's Club · sports cards
    type: retail_search
    store: samsclub
    products: sports
    url: https://www.samsclub.com/s/sports%20trading%20cards
    browser: true
    channel: samsclub
    interval_seconds: 420

  - name: CVS · trading cards
    type: retail_search
    store: cvs
    products: cards
    url: https://www.cvs.com/search?searchTerm=trading%20cards
    browser: true
    channel: pharmacy
    verify_pages: 1
    interval_seconds: 360

  - name: Walgreens · trading cards
    type: retail_search
    store: walgreens
    products: cards
    url: https://www.walgreens.com/search/results.jsp?Ntt=trading%20cards
    browser: true
    channel: pharmacy
    verify_pages: 1
    interval_seconds: 360

  - name: Ace Hardware · Pokémon cards
    type: retail_search
    store: ace
    products: pokemon
    url: https://www.acehardware.com/pokemon-cards
    browser: true
    channel: ace
    verify_pages: 1
    interval_seconds: 300

  - name: Ace Hardware · trading card games
    type: retail_search
    store: ace
    products: cards
    url: https://www.acehardware.com/trading-card-games
    browser: true
    channel: ace
    verify_pages: 1
    interval_seconds: 420

  # B&N's Pokémon pages are books / LEGO / DVDs (it doesn't sell Pokémon cards online), so it has ONE scan:
  # the collectible-card-games collection, keeping Pokémon and sports cards from it.
  - name: Barnes & Noble · trading cards
    type: retail_search
    store: barnes
    cards_only: true
    products: cards
    url: https://www.barnesandnoble.com/collections/toys-games/games/collectible-card-games-1
    browser: true
    channel: barnes
    verify_pages: 1
    interval_seconds: 420

  - name: GameStop · Pokémon cards
    type: retail_search
    store: gamestop
    cards_only: true
    products: pokemon
    url: https://www.gamestop.com/search/?q=pokemon%20trading%20card%20game
    browser: true
    channel: gamestop
    verify_pages: 3
    interval_seconds: 300

  - name: GameStop · sports cards
    type: retail_search
    store: gamestop
    cards_only: true
    products: sports
    url: https://www.gamestop.com/search/?q=sports%20trading%20cards
    browser: true
    channel: gamestop
    verify_pages: 3
    interval_seconds: 420

  - name: Hot Topic · sports cards
    type: retail_search
    store: hottopic
    cards_only: true
    products: sports
    url: https://www.hottopic.com/search?q=trading%20cards
    browser: true
    channel: hottopic
    verify_pages: 1
    interval_seconds: 300

  # Collector Store (Shopify): the coming-soon / pre-order list -> #presales. Read from the collection's own
  # products.json (small, has availability + price + a real add-to-cart link), so no browser is needed.
  - name: Collector Store · coming soon
    type: retail_search
    store: collectorstore
    products: cards
    url: https://collectorstore.com/collections/coming-soon/products.json?limit=250
    browser: false
    channel: presale
    alert_new_listed: true
    stock_pages: 0
    interval_seconds: 180

  # Crunchyroll Store (shares the Hot Topic channel + webhook). Sells Pokémon TCG, no sports cards: one scan of its
  # trading-cards collection (search is robots-blocked), plus a queue watcher like Pokémon Center's.
  - name: Crunchyroll · Pokémon cards
    type: retail_search
    store: crunchyroll
    cards_only: true
    products: pokemon
    url: https://store.crunchyroll.com/collections/trading-cards
    browser: true
    channel: hottopic
    alert_new_listed: true
    verify_pages: 1
    interval_seconds: 360

  - name: Hot Topic · Pokémon cards
    type: retail_search
    store: hottopic
    cards_only: true
    products: pokemon
    url: https://www.hottopic.com/search?q=pokemon%20trading%20card%20game
    browser: true
    channel: hottopic
    verify_pages: 1
    interval_seconds: 360

  # ===== NEWS + REDDIT (raffle announcements and drop times anywhere) =====
  - name: News · Walmart Pokémon drawings
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=walmart+pokemon+(drawing+OR+lottery+OR+raffle)+when:2d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 180
    category: Pokémon
    must_have: [drawing, lottery, raffle, entry, enter]
    urgent_if: ["live now", "is live", "now open", "open now", "starts today", "today at", "tonight"]

  - name: News · Pokémon raffles & invites
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=pokemon+(raffle+OR+drawing+OR+lottery+OR+invite)+(%2230th+Celebration%22+OR+%22Delta+Reign%22+OR+%22elite+trainer%22)+when:2d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 180
    category: Pokémon
    must_have: [raffle, drawing, lottery, invite, entry, queue, pre-order, preorder, drop]
    urgent_if: ["live now", "is live", "now open", "open now", "starts today", "today at", "tonight"]

  # PokeBeach: usually first with Pokémon Center invite-only / lottery news. Same rule as every news feed: posted only
  # when the headline is about cards AND a raffle / drawing / lottery / invite.
  - name: News · PokeBeach
    type: feed
    route_by_store: true
    url: https://www.pokebeach.com/feed
    interval_seconds: 300
    category: Pokémon
    must_have: [raffle, drawing, lottery, invite, invitation, early access]
    urgent_if: ["live now", "is live", "now open", "open now", "starts today", "today at", "tonight"]

  - name: News · Pokémon Center queue & preorders
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=%22pokemon+center%22+(queue+OR+preorder+OR+%22pre-order%22+OR+restock+OR+drop)+when:2d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 180
    category: Pokémon
    must_have: [queue, preorder, pre-order, restock, drop, live]
    urgent_if: ["live now", "is live", "queue is", "now open", "right now"]

  - name: News · Target / Amazon / Best Buy Pokémon
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=pokemon+cards+(target+OR+amazon+OR+%22best+buy%22)+(drop+OR+invite+OR+raffle+OR+drawing+OR+restock)+when:2d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 240
    category: Pokémon
    must_have: [drop, invite, raffle, drawing, restock, queue, release]
    exclude: [review, "price guide"]

  - name: News · Dick's cards & Pokémon
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=%22dick%27s+sporting+goods%22+(pokemon+OR+topps+OR+%22trading+cards%22)+(raffle+OR+drawing+OR+entry+OR+release+OR+drop)+when:3d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 240
    must_have: [raffle, drawing, entry, release, drop, enter]

  - name: News · Topps preorders & drops
    type: feed
    route_by_store: true
    url: https://news.google.com/rss/search?q=topps+(preorder+OR+%22pre-order%22+OR+drawing+OR+%22release+date%22+OR+%22on+sale%22)+(basketball+OR+baseball+OR+football+OR+bowman)+when:2d&hl=en-US&gl=US&ceid=US:en
    interval_seconds: 240
    must_have: [preorder, pre-order, drawing, release, sale, drop]
    exclude: [panini, "upper deck", hockey, soccer]

# Presets for "Watch a page" in the app. Each becomes a keywords watcher with browser: true,
# posting to that store's Discord channel.
watch_presets:
  walmart:   {label: "Walmart drawing", alert: "🚨 WALMART DRAWING OPEN", keywords: ["enter drawing", "enter the drawing", "drawing ends", "limited-time drawing"], channel: walmart}
  target:    {label: "Target",          alert: "🚨 TARGET LIVE",          keywords: ["enter drawing", "join the drawing", "add to cart"], channel: target}
  dicks:     {label: "Dick's",          alert: "🚨 DICK'S ENTRY OPEN",    keywords: ["enter drawing", "enter for a chance", "enter now", "enter to win", "add to cart"], channel: dicks}
  amazon:    {label: "Amazon invite",   alert: "🚨 AMAZON INVITES OPEN",  keywords: ["request invite", "request an invite"], channel: amazon}
  bestbuy:   {label: "Best Buy",        alert: "🚨 BEST BUY LIVE",        keywords: ["request invite", "get invite", "add to cart"], channel: bestbuy}
  pokemon:   {label: "Pokémon Center",  alert: "🚨 POKÉMON CENTER LIVE",  keywords: ["add to cart", "pre-order", "preorder"], channel: pokemon}
  topps:     {label: "Topps product",   alert: "🚨 TOPPS LIVE",           keywords: ["add to cart", "pre-order", "enter drawing", "buy now"], channel: topps}
  custom:    {label: "Other (my words)", alert: "🚨 PAGE LIVE",           keywords: []}
